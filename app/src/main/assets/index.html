<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STARK PHONE</title>
<style>
:root{--c:#bfe9f2;--line:rgba(190,235,245,.75);--bg:rgba(20,50,62,.42)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0c1418;color:var(--c);font-family:"Segoe UI",sans-serif;overflow:hidden}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.7) brightness(.75);display:none}
.tint{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(60,120,140,.22),rgba(5,15,20,.7))}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;padding:8px 14px 8px}
.panel{border:1.5px solid var(--line);border-radius:14px;background:var(--bg);box-shadow:0 0 16px rgba(130,210,230,.2),inset 0 0 12px rgba(130,210,230,.1)}
.bar{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em}
main{flex:1;min-height:0;padding:10px 14px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.dock{display:flex;justify-content:space-around;padding:2px 6px}
.dock button{background:none;border:0;color:var(--c);width:54px;height:50px;padding:6px;filter:drop-shadow(0 0 4px var(--line))}
.dock button svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button.on{color:#fff;filter:drop-shadow(0 0 8px #fff)}
.dock button:active{transform:scale(.85)}
h2{font-weight:300;font-size:15px;letter-spacing:.15em}
input,select{background:transparent;border:0;border-bottom:1px solid var(--line);color:#fff;font-size:15px;padding:6px 2px;outline:0;width:100%}
select option{color:#000}
.btn{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--c);padding:10px 16px;font-size:14px}
.btn:active{background:rgba(190,235,245,.35)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.app{background:none;border:0;color:var(--c);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}
.app img{width:46px;height:46px}
.app span{max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:54px;font-weight:200;letter-spacing:.08em}
#log{font:10px/1.5 ui-monospace,Consolas,monospace;opacity:.85;flex:1;overflow:hidden}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:6px}
.chat{flex:1;overflow:auto;font-size:13px;line-height:1.6}
.chat p{margin-bottom:4px}.chat .me{color:#fff}
canvas{width:100%;flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;touch-action:none}
#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;letter-spacing:.15em;background:rgba(10,30,40,.85)}
#toast.show{opacity:1}
</style></head><body>
<video id="cam" autoplay playsinline muted></video><div class="tint"></div>
<div class="ui">
  <div class="bar"><span id="who">STARK INDUSTRIES</span><span id="clock"></span><span id="tmini"></span></div>
  <main id="main" class="panel"></main>
  <nav class="dock panel" id="dock"></nav>
</div>
<div id="toast" class="panel"></div>
<script>
const $=s=>document.querySelector(s),A=window.Android,main=$('#main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const themes={cyan:['#bfe9f2','rgba(190,235,245,.75)'],gold:['#ffd98a','rgba(255,205,110,.8)'],red:['#ff9a8a','rgba(255,120,100,.8)']};
let S=Object.assign({name:'',theme:'cyan',cam:false},JSON.parse(localStorage.getItem('sp')||'{}'));
let stream;
function camera(on){const v=$('#cam');if(!on){stream&&stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;v.style.display='none';return}
  navigator.mediaDevices&&navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{stream=s;v.srcObject=s;v.style.display='block'}).catch(()=>toast('CAMERA DENIED'))}
function apply(){const t=themes[S.theme]||themes.cyan,r=document.documentElement.style;r.setProperty('--c',t[0]);r.setProperty('--line',t[1]);
  $('#who').textContent=S.name?S.name.toUpperCase()+' / STARK OS':'STARK INDUSTRIES';camera(S.cam)}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1500)}
const pad=n=>String(n).padStart(2,'0');
setInterval(()=>{const d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());const c=$('#bigclock');if(c)c.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())},1000);

// ---- icons (Iron Man style)
const I={
 jarvis:'<path d="M9 22C9 13 15 7 24 7s15 6 15 15v9l-7 9H16l-7-9z"/><path d="M13 21h22l-1 7-5 2H19l-5-2z"/><path d="M24 7v12"/><path d="M17 24h4M27 24h4"/>',
 apps:'<circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="7"/><path d="M24 6v11M24 31v11M6 24h11M31 24h11M11 11l8 8M29 29l8 8M37 11l-8 8M19 29l-8 8"/>',
 phone:'<path d="M13 7l6 2-2 7c2 4 6 8 10 10l5-3 6 5-2 7C20 36 8 24 7 10z"/>',
 web:'<circle cx="24" cy="24" r="17"/><ellipse cx="24" cy="24" rx="7" ry="17"/><path d="M7 24h34M10 14h28M10 34h28"/>',
 timer:'<circle cx="24" cy="27" r="15"/><path d="M24 27V17M19 6h10M24 6v6M38 12l3-3"/>',
 game:'<circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="8"/><path d="M24 16l7 12h-14z"/><path d="M24 3v4M24 41v4M3 24h4M41 24h4"/>',
 scan:'<path d="M6 16V6h10M32 6h10v10M42 32v10H32M16 42H6V32"/><circle cx="24" cy="24" r="8"/><path d="M24 12v4M24 32v4M12 24h4M32 24h4"/>',
 set:'<circle cx="24" cy="24" r="6"/><circle cx="24" cy="24" r="14" stroke-dasharray="6 5"/><circle cx="24" cy="24" r="18"/>'
};
const nav=[['jarvis','JARVIS'],['apps','APPS'],['phone','PHONE'],['web','SEARCH'],['timer','TIMER'],['game','GAME'],['scan','SCAN'],['set','SETTINGS']];
$('#dock').innerHTML=nav.map(([k,l])=>`<button data-k="${k}" title="${l}"><svg viewBox="0 0 48 48">${I[k]}</svg></button>`).join('');
document.querySelectorAll('#dock button').forEach(b=>b.onclick=()=>go(b.dataset.k));

// ---- timer
let tEnd=0,tInt;
function startTimer(sec){tEnd=Date.now()+sec*1000;clearInterval(tInt);tInt=setInterval(tick,250);tick()}
function stopTimer(){tEnd=0;clearInterval(tInt);$('#tmini').textContent='';const e=$('#tt');if(e)e.textContent='00:00'}
function tick(){const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000)),s=pad(r/60|0)+':'+pad(r%60);
  $('#tmini').textContent=tEnd?'⏱ '+s:'';const e=$('#tt');if(e)e.textContent=s;
  if(tEnd&&r<=0){stopTimer();toast('TIMER COMPLETE');navigator.vibrate&&navigator.vibrate([400,200,400,200,400])}}

// ---- views
let apps=[];
function loadApps(){try{apps=JSON.parse(A.apps())}catch(e){apps=[{n:'Demo',p:'x',i:''}]}}
const V={};
V.home=()=>{main.innerHTML=`<h2>${S.name?'おかえりなさい、'+esc(S.name):'WELCOME'}</h2><div class="big" id="bigclock"></div><div id="log"></div>`;
  const hex=n=>[...Array(n)].map(()=>(Math.random()*16|0).toString(16)).join('');
  const log=$('#log');const t=setInterval(()=>{if(!$('#log')){clearInterval(t);return}
    const d=document.createElement('div');d.textContent=`TCP  ${hex(4)}:${hex(4)}  ${hex(8)}  ESTABLISHED`;log.appendChild(d);
    while(log.scrollHeight>log.clientHeight+2&&log.firstChild)log.removeChild(log.firstChild)},450)};
V.apps=()=>{if(!apps.length)loadApps();main.innerHTML=`<input id="q" placeholder="アプリを検索"><div class="grid" id="g"></div>`;
  const g=$('#g'),draw=f=>{g.innerHTML='';apps.filter(a=>a.n.toLowerCase().includes(f)).forEach(a=>{const b=document.createElement('button');b.className='app';
    b.innerHTML=`<img src="data:image/png;base64,${a.i}"><span>${esc(a.n)}</span>`;b.onclick=()=>A&&A.launch(a.p);g.appendChild(b)})};
  draw('');$('#q').oninput=e=>draw(e.target.value.toLowerCase())};
V.phone=()=>{main.innerHTML=`<div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:20px"><div class="keys" id="keys"></div>
  <div style="flex:1"><input id="num" inputmode="tel" placeholder="電話番号" style="font-size:24px"><div class="row" style="margin-top:12px"><button class="btn" id="call">発信</button><button class="btn" id="del">⌫</button></div></div></div>`;
  $('#keys').innerHTML='123456789*0#'.split('').map(k=>`<button class="btn">${k}</button>`).join('');
  document.querySelectorAll('#keys .btn').forEach(b=>b.onclick=()=>$('#num').value+=b.textContent);
  $('#del').onclick=()=>{const n=$('#num');n.value=n.value.slice(0,-1)};
  $('#call').onclick=()=>{const n=$('#num').value.trim();if(n)A?A.dial(n):toast('ANDROIDアプリで使えます')}};
function search(q){if(!q)return;const u=/^https?:\/\//.test(q)?q:'https://www.google.com/search?q='+encodeURIComponent(q);A?A.openWeb(u):window.open(u)}
V.web=()=>{main.innerHTML=`<h2>SEARCH</h2><input id="sq" placeholder="調べたいこと / URL"><div class="row"><button class="btn" id="sg">検索</button></div>`;
  $('#sg').onclick=()=>search($('#sq').value.trim());$('#sq').onkeydown=e=>{if(e.key==='Enter')search(e.target.value.trim())}};
V.timer=()=>{main.innerHTML=`<h2>TIMER</h2><div class="big" id="tt">00:00</div><div class="row" id="pre"></div><div class="row"><input id="tm" type="number" min="1" placeholder="分" style="width:90px"><button class="btn" id="ts">開始</button><button class="btn" id="tx">停止</button></div>`;
  $('#pre').innerHTML=[1,3,5,10].map(m=>`<button class="btn" data-m="${m}">${m}分</button>`).join('');
  document.querySelectorAll('#pre .btn').forEach(b=>b.onclick=()=>startTimer(b.dataset.m*60));
  $('#ts').onclick=()=>{const m=parseFloat($('#tm').value);if(m>0)startTimer(m*60)};$('#tx').onclick=stopTimer;tick()};
V.game=()=>{main.innerHTML=`<div class="row"><h2>REPULSOR TARGET</h2><span id="sc"></span><button class="btn" id="gs">スタート</button></div><canvas id="cv"></canvas>`;
  const cv=$('#cv'),x=cv.getContext('2d');let run=0,score=0,tg=null,end=0,best=+localStorage.getItem('spbest')||0;
  const fit=()=>{cv.width=cv.clientWidth;cv.height=cv.clientHeight};fit();
  const spawn=()=>{tg={x:30+Math.random()*(cv.width-60),y:30+Math.random()*(cv.height-60),r:26,t:Date.now()}};
  const draw=()=>{if(!$('#cv'))return;x.clearRect(0,0,cv.width,cv.height);const l=Math.max(0,(end-Date.now())/1000);
    if(run&&l<=0){run=0;if(score>best){best=score;localStorage.setItem('spbest',best)}}
    $('#sc').textContent=`SCORE ${score}  BEST ${best}  ${run?l.toFixed(1)+'s':''}`;
    if(run&&tg){if(Date.now()-tg.t>1200)spawn();x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--c');x.lineWidth=2;
      [1,.6,.25].forEach(k=>{x.beginPath();x.arc(tg.x,tg.y,tg.r*k,0,7);x.stroke()})}
    requestAnimationFrame(draw)};
  cv.onpointerdown=e=>{if(!run||!tg)return;const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*cv.width/r.width,py=(e.clientY-r.top)*cv.height/r.height;
    if(Math.hypot(px-tg.x,py-tg.y)<tg.r+8){score++;spawn()}};
  $('#gs').onclick=()=>{fit();score=0;run=1;end=Date.now()+20000;spawn()};draw()};
V.scan=()=>{main.innerHTML=`<h2>SCAN</h2><p>外カメラで物をスキャンして判別し、3Dで分解表示する機能は、次の段階で追加します。</p>`};
V.set=()=>{main.innerHTML=`<h2>SETTINGS</h2><div class="row"><input id="sn" placeholder="呼ばれたい名前" value="${esc(S.name)}" style="max-width:240px">
  <select id="st" style="max-width:140px"><option value="cyan">ブルー</option><option value="gold">ゴールド</option><option value="red">レッド</option></select>
  <label><input type="checkbox" id="sc" style="width:auto" ${S.cam?'checked':''}> カメラ背景</label></div>
  <div class="row"><button class="btn" id="sv">保存</button><button class="btn" id="dl">保存データを全て削除</button></div>`;
  $('#st').value=S.theme;
  $('#sv').onclick=()=>{S={name:$('#sn').value.trim(),theme:$('#st').value,cam:$('#sc').checked};localStorage.setItem('sp',JSON.stringify(S));apply();toast('SAVED')};
  $('#dl').onclick=()=>{if(confirm('設定・ゲームのベストなど全て削除します。よろしいですか?')){localStorage.clear();S={name:'',theme:'cyan',cam:false};apply();toast('DELETED');V.set()}}};
// JARVIS: ルール式(Gemma 3 1Bは次の段階で接続)
V.jarvis=()=>{main.innerHTML=`<h2>JARVIS</h2><div class="chat" id="ch"></div><input id="jq" placeholder="例: タイマー3分 / 電話 090... / 検索 天気 / アプリ名">`;
  const ch=$('#ch'),say=(t,me)=>{const p=document.createElement('p');p.className=me?'me':'';p.textContent=(me?'> ':'JARVIS: ')+t;ch.appendChild(p);ch.scrollTop=1e9};
  say('お呼びですか。タイマー・電話・検索・アプリ起動ができます。');
  $('#jq').onkeydown=e=>{if(e.key!=='Enter')return;const t=e.target.value.trim();e.target.value='';if(!t)return;say(t,1);let m;
    if(m=t.match(/タイマー\s*(\d+)\s*分/)){startTimer(m[1]*60);say(m[1]+'分のタイマーを開始しました。')}
    else if(m=t.match(/電話\s*([\d\-+*#]+)/)){say('発信します。');A&&A.dial(m[1])}
    else if(m=t.match(/^検索\s*(.+)/)){say('検索します。');search(m[1])}
    else if(/時間|何時/.test(t)){const d=new Date();say(d.getHours()+'時'+d.getMinutes()+'分です。')}
    else{if(!apps.length)loadApps();const a=apps.find(a=>t.toLowerCase().includes(a.n.toLowerCase()));
      if(a){say(a.n+'を起動します。');A&&A.launch(a.p)}else say('すみません、まだその会話はできません。(Gemma接続は次の段階です)')}}};
function go(k){document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));V[k]()}
apply();go('home');
</script></body></html>
